<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物車與下單</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .cart {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .item-info {
            flex: 1;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .quantity button {
            background: #ddd;
        }

        .submit {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>餐點購物車</h1>

    <div class="cart">

        <div id="cartItems"></div>

        <div class="total">
            總金額：$<span id="total">0</span>
        </div>

        <label>
            送餐地址
            <input id="address" type="text" placeholder="請輸入送餐地址">
        </label>

        <button class="submit" onclick="submitOrder()">
            送出訂單
        </button>

    </div>

    <script>

        const cart = [
            {
                menuItemId: 1,
                name: "雞腿便當",
                price: 100,
                quantity: 1
            },
            {
                menuItemId: 2,
                name: "排骨便當",
                price: 90,
                quantity: 1
            },
            {
                menuItemId: 3,
                name: "紅茶",
                price: 30,
                quantity: 2
            }
        ];


        function renderCart() {

            const container = document.getElementById("cartItems");

            if (cart.length === 0) {
                container.innerHTML =
                    '<div class="empty">購物車是空的</div>';

                updateTotal();
                return;
            }

            container.innerHTML = "";

            cart.forEach((item, index) => {

                const div = document.createElement("div");

                div.className = "item";

                div.innerHTML = `
            <div class="item-info">
                <strong>${item.name}</strong>
                <br>
                $${item.price} × ${item.quantity}
            </div>

            <div class="quantity">
                <button onclick="decrease(${index})">−</button>

                <span>${item.quantity}</span>

                <button onclick="increase(${index})">+</button>
            </div>
        `;

                container.appendChild(div);
            });

            updateTotal();
        }


        function increase(index) {

            cart[index].quantity++;

            renderCart();
        }


        function decrease(index) {

            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            }

            renderCart();
        }


        function updateTotal() {

            const total = cart.reduce(
                (sum, item) =>
                    sum + item.price * item.quantity,
                0
            );

            document.getElementById("total").textContent = total;
        }


        function submitOrder() {

            const address =
                document.getElementById("address").value.trim();

            if (cart.length === 0) {
                alert("購物車不能為空！");
                return;
            }

            if (!address) {
                alert("請輸入送餐地址！");
                return;
            }

            const order = {

                items: cart.map(item => ({
                    menuItemId: item.menuItemId,
                    quantity: item.quantity
                })),

                address: address
            };

            console.log("準備送出的訂單：");
            console.log(order);

            /*
                之後接真正 API 時改成：
        
                fetch("/api/orders", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(order)
                });
            */

            alert(
                "訂單送出成功！\n\n" +
                "狀態：Pending\n" +
                "送餐地址：" + address
            );
        }


        renderCart();

    </script>

</body>

</html>
